name: ETF Quant

on:
  workflow_dispatch:

  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  quant:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 获取代码
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # 2. 设置 Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安装依赖
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 4. 更新 ETF 数据
      # =====================================================

      - name: Update ETF data
        run: |
          python update_data.py

      # =====================================================
      # 5. V7.3 / V7.4 历史回测
      # =====================================================

      - name: Run V7 Backtest
        run: |
          python backtest_etf_v7.py

      # =====================================================
      # 6. V7.4.1 建仓信号严格样本外验证
      # =====================================================

      - name: Run V7.4.1 Entry Validation
        run: |
          python backtest_etf_v7_4_1.py

      # =====================================================
      # 7. V7.4 当前实盘执行信号
      # =====================================================

      - name: Run V7.4 Signal
        run: |
          python v7_4_signal.py

      # =====================================================
      # 8. 保存更新后的数据和结果
      # =====================================================

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          git diff --cached --quiet || git commit -m "Update ETF quant results"

          git push
