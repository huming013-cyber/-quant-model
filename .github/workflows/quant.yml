name: ETF Quant Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  quant:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 下载代码
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. 设置 Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安装依赖
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 4. 更新ETF数据
      # =====================================================

      - name: Update ETF data
        run: |
          python update_data.py

      # =====================================================
      # 5. 原来的V4回测
      # =====================================================

      - name: Run ETF V4 backtest
        run: |
          python backtest_etf.py

      # =====================================================
      # 6. V5复杂择时模型
      # =====================================================

      - name: Run ETF V5 backtest
        run: |
          python backtest_etf_v5.py

      # =====================================================
      # 7. V6分批建仓优化
      # =====================================================

      - name: Run ETF V6 backtest
        run: |
          python backtest_etf_v6.py

      # =====================================================
      # 8. V7滚动历史验证
      # =====================================================

      - name: Run ETF V7 backtest
        run: |
          python v7_4_signal.py

      # =====================================================
      # 9. 保存所有回测结果
      # =====================================================

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Update ETF quantitative results"

          git push
