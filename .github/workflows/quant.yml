name: ETF Quant

on:
  workflow_dispatch:

  schedule:
    # 每个交易日北京时间 16:30 左右运行
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  quant:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 获取最新代码
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # 2. 设置 Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安装依赖
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 4. 更新 ETF 最新数据
      # =====================================================

      - name: Update ETF data
        run: |
          python update_data.py

      # =====================================================
      # 5. V7.3 历史回测
      # =====================================================

      - name: Run V7 Backtest
        run: |
          python backtest_etf_v7.py

      # =====================================================
      # 6. V7.4.1 严格样本外验证
      # =====================================================

      - name: Run V7.4.1 Entry Validation
        run: |
          python backtest_etf_v7_4_1.py

      # =====================================================
      # 7. V7.4 当前执行信号
      # =====================================================

      - name: Run V7.4 Signal
        run: |
          python v7_4_signal.py

      # =====================================================
      # 8. V7.5 极端风险保护
      # =====================================================

      - name: Run V7.5
        run: |
          python backtest_etf_v7_5.py

      # =====================================================
      # 9. V7.6 自动风险保护参数优化
      # =====================================================

      - name: Run V7.6
        run: |
          python backtest_etf_v7_6.py

      # =====================================================
      # 10. V8 模型冻结 + 严格样本外最终评价
      # =====================================================

      - name: Run V8 Final Evaluation
        run: |
          python backtest_etf_v8.py

      # =====================================================
      # 11. 保存所有量化结果
      # =====================================================

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git add trades.csv

          git diff --cached --quiet || git commit -m "Update ETF V8 quant results and trading signals"

          git push
